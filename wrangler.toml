name = "lodge-demo"
main = "src/worker.js"

# The demo's own address (APP-LG-026)
routes = [{ pattern = "lodge-demo.appdoivo.com/*", zone_name = "appdoivo.com" }]
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# The PDF book uses the browser build of pdfkit (fonts built in, no file reads)
[alias]
pdfkit = "pdfkit/js/pdfkit.standalone.js"

# Pages and static files; /api/* always runs the Worker first.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Daily demo reset at 04:00 UTC
[triggers]
crons = ["0 4 * * *", "* * * * *"]

[vars]
APP_ENV = "demo"
ENABLE_PLAZA = "true"
ENABLE_MEMO = "true"
ENABLE_ADMIN_PROMOTION = "true"

[[d1_databases]]
binding = "DB"
database_name = "lodge-demo"
database_id = "37b7ea98-b648-47cc-b2f2-ab0d543e9b08"

[[r2_buckets]]
binding = "FILES"
bucket_name = "lodge-demo-files"
jurisdiction = "eu"

# Secret (never in this file): TOKEN_SECRET, the same HMAC secret the Node app uses.

# Workers Logs: errors and console output, readable in the Cloudflare dashboard (APP-HB-013)
[observability]
enabled = true
head_sampling_rate = 1
